services:
  test-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: wolfboard_test
      POSTGRES_PASSWORD: wolfboard_test
    ports:
      - "${TEST_POSTGRES_PORT:-55432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wolfboard_test -d postgres"]
      interval: 2s
      timeout: 5s
      retries: 15
