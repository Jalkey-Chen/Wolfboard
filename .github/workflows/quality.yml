name: Quality Gates

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type-check
        run: npx tsc --noEmit
      - name: Build production bundle
        run: npm run build

  backend:
    name: Backend
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: wolfboard_ci
          POSTGRES_PASSWORD: wolfboard_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wolfboard_ci -d postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      DATABASE_URL: postgresql+psycopg://wolfboard_ci:wolfboard_ci@localhost:5432/postgres
      TEST_DATABASE_ADMIN_URL: postgresql+psycopg://wolfboard_ci:wolfboard_ci@localhost:5432/postgres
      JWT_SECRET_KEY: ci-only-not-a-production-secret
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Install locked dependencies
        run: uv sync --frozen --dev
      - name: Upgrade CI database to Alembic head
        run: uv run alembic upgrade head
      - name: Run backend tests
        run: uv run pytest -q
