[project]
name = "wolfboard-backend"
version = "0.1.0"
description = "FastAPI backend for the Wolfboard tournament platform."
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.14.0",
  "bcrypt<4.1",
  "fastapi>=0.116.0",
  "passlib[bcrypt]>=1.7.4",
  "psycopg[binary]>=3.2.0",
  "pydantic-settings>=2.7.0",
  "python-jose[cryptography]>=3.3.0",
  "sqlalchemy>=2.0.36",
  "uvicorn[standard]>=0.34.0",
]

[dependency-groups]
dev = [
  "httpx>=0.28.0",
  "pytest>=8.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = false
